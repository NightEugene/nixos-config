[shell]
lang = "ru"
telemetry_enabled = false
offline_mode = false

[shell.panel]
transparency_mode = "soft"
borders = true
shadow = true
launcher_placement = "centered"
control_center_placement = "attached"
wallpaper_placement = "attached"
session_placement = "attached"

[theme]
mode = "dark"
source = "builtin"
builtin = "Gruvbox"

[location]
auto_locate = false
address = "Saint petersburg"

[weather]
enabled = true
unit = "celsius"
effects = true

[wallpaper]
enabled = true
fill_mode = "crop"
directory = "~/Pictures/Wallpapers"
transition = ["fade", "wipe", "disc", "stripes", "zoom", "honeycomb"]
transition_duration = 1500
edge_smoothness = 0.05

[wallpaper.default]
path = "@wallpaperFile@"

[notification]
enable_daemon = true

[osd]
position = "top_right"
background_opacity = 0.97

[bar.main]
position = "top"
thickness = 34
background_opacity = 0.93
radius = 12
margin_h = 4
margin_v = 4
padding = 14
widget_spacing = 6
scale = 1.0
shadow = true
auto_hide = false
reserve_space = true
capsule = true

start = ["launcher", "clock", "sysmon", "active_window", "media"]
center = ["workspaces"]
end = ["tray", "notifications", "volume", "brightness", "network", "bluetooth", "keyboard_layout", "battery", "control-center"]

[widget.clock]
format = "{:%H:%M}"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.active_window]
max_length = 145
min_length = 80
display = "icon_and_text"
title_scroll = "hover"

[widget.media]
max_width = 145
panel_show_album_art = true
show_album_art = true
show_artist_first = true
show_progress_ring = true

[widget.keyboard_layout]
display = "short"
show_icon = false
show_label = true
hide_when_single_layout = false

[widget.keyboard_layout.custom_labels]
us = "🇺🇸"
ru = "🇷🇺"

[widget.battery]
device = "auto"
display_mode = "glyph"
show_label = true
hide_when_plugged = false
hide_when_full = false

[widget.bluetooth]
show_label = false
hide_when_no_connected_device = false

[widget.network]
show_label = false
show_vpn_label = false

[widget.workspaces]
display = "name"
max_label_chars = 10

[widget.launcher]
use_distro_logo = false
icon = "rocket"

[widget.control-center]
use_distro_logo = false
icon = "noctalia"

[shell.session]
grid = true
grid_columns = 3

[[shell.session.actions]]
action = "lock"
enabled = true
shortcut = "1"

[[shell.session.actions]]
action = "suspend"
enabled = true
shortcut = "2"

[[shell.session.actions]]
action = "command"
label = "Hibernate"
glyph = "hibernate"
command = "systemctl hibernate"
enabled = true
shortcut = "3"

[[shell.session.actions]]
action = "reboot"
enabled = true
shortcut = "4"

[[shell.session.actions]]
action = "logout"
enabled = true
shortcut = "5"

[[shell.session.actions]]
action = "shutdown"
enabled = true
shortcut = "6"

[[shell.session.actions]]
action = "command"
label = "Reboot to UEFI"
glyph = "reboot"
command = "systemctl reboot --firmware-setup"
enabled = true
shortcut = "7"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 70.0
box_width = 400.0
cx = 768.0
cy = 432.0
output = "eDP-1"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
input_opacity = 1.0
input_radius = 6.0
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_password_hint = true
